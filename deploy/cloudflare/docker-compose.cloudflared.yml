# JalaDesk Self-Hosted Web Gateway — Zero-Port-Forwarding Cloudflare Tunnel Stack
#
# Zero open inbound firewall ports! `cloudflared` establishes an outbound-only
# encrypted tunnel to Cloudflare Edge and routes traffic to `http://jaladesk-gateway:8443`.
#
# Usage from repository root:
#   cp deploy/.env.example deploy/.env
#   # Set CLOUDFLARE_TUNNEL_TOKEN in deploy/.env and route your Cloudflare Public Hostname
#   # to Service URL: http://jaladesk-gateway:8443
#   docker compose --env-file deploy/.env -f deploy/cloudflare/docker-compose.cloudflared.yml up -d
#   docker logs jaladesk-gateway

services:
  jaladesk-gateway:
    build:
      context: ../..
      dockerfile: Dockerfile.gateway
    image: ghcr.io/ribato22/jaladesk-gateway:1.17.0
    container_name: jaladesk-gateway
    restart: unless-stopped
    # ZERO exposed host ports — only reachable from cloudflared over the internal bridge.
    expose:
      - "8443"
    environment:
      JALADESK_GATEWAY_HOST: "0.0.0.0"
      JALADESK_GATEWAY_PORT: "8443"
      JALADESK_GATEWAY_TOKEN: "${JALADESK_GATEWAY_TOKEN:-}"
      JALADESK_GATEWAY_CORS_ORIGINS: "${JALADESK_GATEWAY_CORS_ORIGINS:-https://ribato22.github.io}"
      JALADESK_GATEWAY_ALLOW_CIDRS: "${JALADESK_GATEWAY_ALLOW_CIDRS:-}"
      JALADESK_GATEWAY_DENY_CIDRS: "${JALADESK_GATEWAY_DENY_CIDRS:-}"
      JALADESK_GATEWAY_SERVE_UI: "${JALADESK_GATEWAY_SERVE_UI:-0}"
      JALADESK_GATEWAY_DEMO: "${JALADESK_GATEWAY_DEMO:-0}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8443/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - jaladesk-tunnel

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: jaladesk-cloudflared
    restart: unless-stopped
    depends_on:
      jaladesk-gateway:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - "${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in deploy/.env}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - jaladesk-tunnel

networks:
  jaladesk-tunnel:
    driver: bridge
