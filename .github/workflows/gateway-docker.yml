name: Publish Gateway Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gateway-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Publish Multi-Arch Gateway (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ribato22/jaladesk-gateway
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=JalaDesk Self-Hosted Web Gateway
            org.opencontainers.image.description=Zero-trust multi-protocol WebSocket (JSR1) gateway for RDP (FreeRDP 3), VNC, SSH PTY, and streaming SFTP.
            org.opencontainers.image.source=https://github.com/ribato22/jaladesk
            org.opencontainers.image.url=https://ribato22.github.io/jaladesk/app/
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push multi-arch gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
