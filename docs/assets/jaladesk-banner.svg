<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E141A"/>
      <stop offset="52%" stop-color="#192838"/>
      <stop offset="100%" stop-color="#243B53"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EDBA6E"/>
      <stop offset="50%" stop-color="#F7D69C"/>
      <stop offset="100%" stop-color="#DDA254"/>
    </linearGradient>
    <linearGradient id="sapphireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F6F9C"/>
      <stop offset="100%" stop-color="#5AA2D4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2F3B49" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="240" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="240" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <circle cx="220" cy="60" r="180" fill="#2F6F9C" fill-opacity="0.18"/>
  <circle cx="980" cy="180" r="210" fill="#EDBA6E" fill-opacity="0.10"/>

  <!-- Decorative Simpul Jala Geometric Nodes (Left & Right) -->
  <g stroke="#5AA2D4" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <polygon points="90,120 135,75 180,120 135,165"/>
    <polygon points="105,120 135,90 165,120 135,150" stroke="#EDBA6E" stroke-opacity="0.35"/>
    <circle cx="135" cy="120" r="6" fill="#EDBA6E" fill-opacity="0.45"/>
    <polygon points="1020,120 1065,75 1110,120 1065,165"/>
    <polygon points="1035,120 1065,90 1095,120 1065,150" stroke="#EDBA6E" stroke-opacity="0.35"/>
    <circle cx="1065" cy="120" r="6" fill="#EDBA6E" fill-opacity="0.45"/>
  </g>

  <!-- Top Pill Badge -->
  <rect x="425" y="34" width="350" height="26" rx="13" fill="#141A21" stroke="#EDBA6E" stroke-opacity="0.55" stroke-width="1"/>
  <text x="600" y="51" text-anchor="middle" fill="#EDBA6E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">
    SAPPHIRE-GOLD ZERO-TRUST WORKSPACE
  </text>

  <!-- Main Title -->
  <text x="600" y="118" text-anchor="middle" fill="#E3EAF2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
    Jala<tspan fill="url(#goldGrad)">Desk</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="154" text-anchor="middle" fill="#C3CFDB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500">
    Unified Multi-Protocol Remote Desktop (RDP &amp; VNC) • Interactive SSH &amp; SFTP • Zero-Trust Vault • 46 SRE Studios
  </text>

  <!-- Bottom Feature Pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600">
    <rect x="210" y="178" width="180" height="28" rx="7" fill="#141A21" fill-opacity="0.85" stroke="#2F6F9C" stroke-width="1"/>
    <text x="300" y="196" text-anchor="middle" fill="#5AA2D4">FreeRDP 3.x + RFB 3.8</text>

    <rect x="404" y="178" width="190" height="28" rx="7" fill="#141A21" fill-opacity="0.85" stroke="#2F6F9C" stroke-width="1"/>
    <text x="499" y="196" text-anchor="middle" fill="#80D3A3">AES-256-GCM + TOTP 2FA</text>

    <rect x="608" y="178" width="182" height="28" rx="7" fill="#141A21" fill-opacity="0.85" stroke="#2F6F9C" stroke-width="1"/>
    <text x="699" y="196" text-anchor="middle" fill="#EDBA6E">46 Built-in Studios</text>

    <rect x="804" y="178" width="186" height="28" rx="7" fill="#141A21" fill-opacity="0.85" stroke="#2F6F9C" stroke-width="1"/>
    <text x="897" y="196" text-anchor="middle" fill="#E3EAF2">macOS • Win • iOS • Android</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="236" width="1200" height="4" fill="url(#goldGrad)"/>
</svg>
