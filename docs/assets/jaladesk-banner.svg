<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E141A"/>
      <stop offset="52%" stop-color="#192838"/>
      <stop offset="100%" stop-color="#243B53"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EDBA6E"/>
      <stop offset="50%" stop-color="#F7D69C"/>
      <stop offset="100%" stop-color="#DDA254"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2F3B49" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="240" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="240" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <circle cx="220" cy="60" r="180" fill="#2F6F9C" fill-opacity="0.18"/>
  <circle cx="980" cy="180" r="210" fill="#EDBA6E" fill-opacity="0.10"/>

  <!-- Decorative Simpul Jala Geometric Nodes (Left & Right) -->
  <g stroke="#5AA2D4" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <polygon points="65,120 110,75 155,120 110,165"/>
    <polygon points="80,120 110,90 140,120 110,150" stroke="#EDBA6E" stroke-opacity="0.35"/>
    <circle cx="110" cy="120" r="6" fill="#EDBA6E" fill-opacity="0.45"/>
    <polygon points="1045,120 1090,75 1135,120 1090,165"/>
    <polygon points="1060,120 1090,90 1120,120 1090,150" stroke="#EDBA6E" stroke-opacity="0.35"/>
    <circle cx="1090" cy="120" r="6" fill="#EDBA6E" fill-opacity="0.45"/>
  </g>

  <!-- Top Pill Badge -->
  <rect x="420" y="32" width="360" height="26" rx="13" fill="#141A21" stroke="#EDBA6E" stroke-opacity="0.55" stroke-width="1"/>
  <text x="600" y="49" text-anchor="middle" fill="#EDBA6E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">
    SAPPHIRE-GOLD ZERO-TRUST WORKSPACE
  </text>

  <!-- Main Title -->
  <text x="600" y="116" text-anchor="middle" fill="#E3EAF2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
    Jala<tspan fill="url(#goldGrad)">Desk</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="152" text-anchor="middle" fill="#C3CFDB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500">
    Unified Multi-Protocol Remote Desktop (RDP &amp; VNC) • Interactive SSH &amp; SFTP • Zero-Trust Vault • 46 SRE Studios
  </text>

  <!-- Bottom Feature Pills (Generously spaced & wide so text never touches borders) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">
    <rect x="172" y="176" width="196" height="30" rx="8" fill="#141A21" fill-opacity="0.9" stroke="#2F6F9C" stroke-width="1"/>
    <text x="270" y="195" text-anchor="middle" fill="#5AA2D4">FreeRDP 3.x &amp; VNC Engine</text>

    <rect x="382" y="176" width="204" height="30" rx="8" fill="#141A21" fill-opacity="0.9" stroke="#2F6F9C" stroke-width="1"/>
    <text x="484" y="195" text-anchor="middle" fill="#80D3A3">AES-256-GCM &amp; TOTP 2FA</text>

    <rect x="600" y="176" width="184" height="30" rx="8" fill="#141A21" fill-opacity="0.9" stroke="#2F6F9C" stroke-width="1"/>
    <text x="692" y="195" text-anchor="middle" fill="#EDBA6E">46 Built-in SRE Studios</text>

    <rect x="798" y="176" width="230" height="30" rx="8" fill="#141A21" fill-opacity="0.9" stroke="#2F6F9C" stroke-width="1"/>
    <text x="913" y="195" text-anchor="middle" fill="#E3EAF2">macOS • Windows • iOS • Android</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="236" width="1200" height="4" fill="url(#goldGrad)"/>
</svg>
