name: jaladesk_mobile
description: JalaDesk Mobile (iOS, iPadOS & Android) — Enterprise Remote Desktop (FreeRDP 3.x / VNC RFB 3.8), SSHv2 PTY / SFTP & Zero-Trust Vault Companion.
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dartssh2: ^2.9.0
  crypto: ^3.0.3
  pointycastle: ^4.0.0
  shared_preferences: ^2.3.2
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app-icon.png
