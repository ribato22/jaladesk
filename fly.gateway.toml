# JalaDesk Self-Hosted Web Gateway — Production Fly.io Configuration
#
# Quick Deploy:
#   fly launch --config fly.gateway.toml --copy-config --no-deploy
#   fly secrets set JALADESK_GATEWAY_TOKEN="$(openssl rand -hex 32)"
#   fly deploy --config fly.gateway.toml

app = "jaladesk-gateway"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.gateway"

[env]
  JALADESK_GATEWAY_HOST = "0.0.0.0"
  JALADESK_GATEWAY_PORT = "8443"
  JALADESK_GATEWAY_CORS_ORIGINS = "https://ribato22.github.io"
  JALADESK_GATEWAY_SERVE_UI = "0"
  JALADESK_GATEWAY_DEMO = "0"

[http_service]
  internal_port = 8443
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  # Expects HTTP 200 OK JSON from /healthz (src/gateway/server.ts)
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
    protocol = "http"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
