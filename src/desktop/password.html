<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"><title>Document Password</title><link rel="stylesheet" href="style.css"></head>
<body class="credential"><form id="password"><h2 id="title">Document Password</h2><p id="name"></p><p id="error" role="alert"></p><label>Password<input id="pw" type="password" autocomplete="off" maxlength="1024" autofocus></label><label id="confirm-row" hidden>Confirm password<input id="pw2" type="password" autocomplete="off" maxlength="1024"></label><p id="hint" hidden></p><label class="check" id="remember-row" hidden><input id="remember" type="checkbox" aria-describedby="remember-note">Remember document key on this computer</label><p id="remember-note" class="hint" hidden>Key is stored in your system Keychain so this document opens without a password prompt on this computer. Your password itself is not stored.</p><div class="buttons"><button type="button" id="cancel" class="quiet">Cancel</button><button id="ok">OK</button></div></form><script src="password.js"></script></body></html>
