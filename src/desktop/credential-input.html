<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Credential Input</title><link rel="stylesheet" href="style.css"></head>
<body class="credential"><form id="input-form"><h2>Credential Input</h2><p id="target"></p><p id="input-error" role="alert"></p>
<div id="credential-fields"><p id="existing-status" class="hint"></p><label>Username<input id="username" autocomplete="off" maxlength="256" autofocus></label><label>Domain or Host<input id="domain" autocomplete="off" maxlength="256" aria-describedby="domain-note"></label><p id="domain-note" class="hint">Leave blank for a local account.</p>
<label>Password<select id="password-action"><option value="keep">Keep existing</option><option value="replace">Replace password</option><option value="remove">Remove password</option></select></label><input id="password" type="password" aria-label="New password" autocomplete="new-password" maxlength="65536" disabled>
<fieldset><legend>Password Generator</legend><label>Length<input id="length" type="number" min="12" max="128" value="20"></label><label class="check"><input id="lowercase" type="checkbox" checked>Lowercase</label><label class="check"><input id="uppercase" type="checkbox" checked>Uppercase</label><label class="check"><input id="digits" type="checkbox" checked>Digits</label><label class="check"><input id="symbols" type="checkbox">Symbols</label><label class="check"><input id="exclude-ambiguous" type="checkbox" checked>Avoid ambiguous characters</label><button type="button" id="generate">Generate Password</button></fieldset>
<fieldset><legend>TOTP</legend><label>Action<select id="totp-action"><option value="keep">Keep existing</option><option value="replace">Replace seed</option><option value="remove">Remove TOTP</option></select></label><label>New Base32 Seed<input id="totp-secret" type="password" autocomplete="off" maxlength="208" disabled></label><label>Algorithm<select id="totp-algorithm"><option value="sha1">SHA1</option><option value="sha256">SHA256</option><option value="sha512">SHA512</option></select></label><label>Digits<select id="totp-digits"><option value="6">6</option><option value="8">8</option></select></label><label>Period (seconds)<input id="totp-period" type="number" min="15" max="120" value="30"></label></fieldset>
<fieldset><legend>Private Key</legend><label>Action<select id="private-key-action"><option value="keep">Keep existing</option><option value="replace">Replace key</option><option value="remove">Remove key</option></select></label><label>Format<select id="private-key-mode"><option value="path">File path</option><option value="embedded">Embedded Base64</option></select></label><label>New Path or Base64<textarea id="private-key-value" maxlength="65536" autocomplete="off" disabled></textarea></label><label>Passphrase<select id="passphrase-action"><option value="keep">Keep existing</option><option value="replace">Replace passphrase</option><option value="remove">Remove passphrase</option></select></label><input id="passphrase" type="password" aria-label="New passphrase" autocomplete="new-password" maxlength="65536" disabled></fieldset></div>
<div id="protected-fields" hidden><label>Action<select id="protected-action"><option value="replace">Replace protected value</option><option value="remove">Remove value</option></select></label><label>New Value (JSON)<textarea id="protected-value" maxlength="65536" autocomplete="off" aria-describedby="protected-note"></textarea></label><p id="protected-note" class="hint">Stored values are not displayed. Wrap strings in JSON quotes, e.g. "value".</p></div>
<div class="buttons"><button type="button" id="cancel" class="quiet">Cancel</button><button type="submit">Apply</button></div></form><script type="module" src="../../dist/src/desktop/credential-input.js"></script></body></html>
